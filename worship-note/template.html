<!DOCTYPE html>
<html lang="{{HTML_LANG}}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{PAGE_TITLE}}</title>
  <meta name="description" content="{{META_DESCRIPTION}}" />
  <link rel="canonical" href="{{CANONICAL_URL}}" />
{{HREFLANG_LINKS}}
{{BASE_TAG}}  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Encode+Sans+Expanded:wght@800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="favicon.png" />

  <!-- 이 파일 자체가 앱 본체(main.dart.js)를 직접 붙이는 로더 스크립트다.
       flutter.js가 만드는 _flutter.loader만 쓰고, Flutter가 기본 생성하는
       index.html(전체 <body>를 앱이 통째로 차지)은 쓰지 않는다 — 대신 이 페이지의
       #wn-app-host에 붙여서, 얇은 뒤로가기 바 아래로 앱이 화면 대부분을 차지하게 한다. -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <!-- 다른 도구 페이지와 달리 소개문·푸터 없이 앱이 화면 대부분을 그대로 채운다.
       뒤로가기는 앱 위에 겹쳐 뜨는 오버레이가 아니라 얇은 상단 바 안에 둔다 —
       앱 화면(노트 편집 등)도 자기 자신의 좌상단 뒤로가기·우상단 메뉴 버튼을 쓰는데,
       오버레이로 띄우면 정확히 같은 자리에 겹쳐서 앱 내비게이션을 막아버렸다
       (실사용 중 발견: 노트 편집 화면에서 뒤로가기가 안 눌리는 문제).
       h1은 화면엔 안 보이지만(.sr-only) 검색엔진·스크린리더용으로 남겨둔다. -->
  <h1 class="sr-only">{{H1}}</h1>

  <div class="top-bar">
    <a href="{{BACK_LINK_HREF}}" class="back-link">{{BACK_LINK_TEXT}}</a>
  </div>

  <div class="wn-app-frame" id="wn-app-frame">
    <div class="wn-embed-loader" id="wn-embed-loader" role="status" aria-live="polite">
      <div class="wn-spinner"></div>
    </div>
    <div id="wn-app-host" class="wn-app-host"></div>
  </div>

  <script>
    // Flutter 엔진을 body 전체가 아니라 #wn-app-host 안에만 붙인다(hostElement).
    // 이게 이 페이지가 iframe 없이도 사이트 공통 상단바/푸터와 한 페이지에
    // 자연스럽게 같이 있을 수 있는 핵심이다.
    window.addEventListener('load', function () {
      _flutter.loader.loadEntrypoint({
        onEntrypointLoaded: function (engineInitializer) {
          engineInitializer.initializeEngine({
            hostElement: document.getElementById('wn-app-host'),
          }).then(function (appRunner) {
            appRunner.runApp();
            var loader = document.getElementById('wn-embed-loader');
            if (loader) loader.remove();
          });
        },
      });
    });
  </script>

</body>
</html>
